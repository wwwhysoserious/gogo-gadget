plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'app.gogogadget'
    compileSdk 35

    defaultConfig {
        applicationId 'app.gogogadget'
        minSdk 30
        targetSdk 35
        versionCode 36
        versionName "0.9.6"
    }

    signingConfigs {
        debug {
            enableV1Signing = true
            enableV2Signing = true
        }
    }

    buildTypes {
        release {
            // TEST BUILD ONLY: signed with the debug key so it installs without a keystore.
            // Never distribute this APK.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig = signingConfigs.debug
        }
    }

    buildFeatures {
        compose true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2025.05.01')
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.activity:activity-compose:1.10.1'
    // ADB pairing (SPAKE2/TLS) and connect without a PC. GPL-3.0-or-later OR Apache-2.0; see docs/ADB-LIBRARY.md.
    implementation 'com.github.MuntashirAkon:libadb-android:3.1.1'
    // Used directly to build the self-signed certificate; the same version libadb-android depends on.
    implementation 'org.bouncycastle:bcprov-jdk15to18:1.81'
    // Pairing needs TLS exportKeyingMaterial; libadb-android only finds it in this library (the platform copy is a
    // hidden API). Apache-2.0. See docs/ADB-LIBRARY.md.
    implementation 'org.conscrypt:conscrypt-android:2.5.3'
    testImplementation 'junit:junit:4.13.2'
    // Android's org.json is only a stub on the plain JVM; the unit tests need a real one.
    testImplementation 'org.json:json:20240303'
}
